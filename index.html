<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keezo</title>
<meta property="og:title" content="Keezo">
<meta property="og:description" content="Your friend invited you to Keezo.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f7;
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { min-height: 100%; box-sizing: border-box; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #aeaeb2; max-width: 320px; }
  .actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  a.button { display: block; background: #0a84ff; color: #fff; text-decoration: none;
    font-weight: 600; padding: 14px 28px; border-radius: 14px; }
  a.button.secondary { background: #2c2c2e; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p id="opening">Opening Keezo…</p>
  <section id="didnt" hidden>
    <h1>Didn’t open?</h1>
    <p>Keezo may not be on this phone, or this browser blocked it. If it is, tap Open Keezo. If not, get it from TestFlight, then tap your friend’s link again.</p>
    <div class="actions">
      <a class="button" id="open" href="#">Open Keezo</a>
      <a class="button secondary" href="https://testflight.apple.com/join/A3ftndxn">Get Keezo</a>
    </div>
  </section>
  <section id="bad" hidden>
    <h1>This link is incomplete.</h1>
    <p>Ask your friend for a new one.</p>
  </section>
</main>
<script>
  (function () {
    var code = (new URLSearchParams(location.search).get("c") || "").toLowerCase();
    var opening = document.getElementById("opening");
    if (!/^[a-z0-9]{1,32}$/.test(code)) {
      opening.hidden = true;
      document.getElementById("bad").hidden = false;
      return;
    }
    var target = "yonder://invite?c=" + code;
    document.getElementById("open").href = target;
    function showDidnt() {
      clearTimeout(timer);
      opening.hidden = true;
      document.getElementById("didnt").hidden = false;
    }
    var timer = setTimeout(showDidnt, 1500);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(timer);
      else showDidnt();
    });
    location.href = target;
  })();
</script>
</body>
</html>
